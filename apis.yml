aid: adarx-pharmaceuticals
name: ADARx Pharmaceuticals
description: >-
  ADARx Pharmaceuticals, Inc. is a clinical-stage biotechnology company headquartered at 5871
  Oberlin Drive, San Diego, California, founded in 2019 and developing next-generation RNA
  therapeutics intended to control the expression of specific disease drivers with highly selective
  RNA-targeted medicines. Its proprietary platform spans RNA interference, RNA editing and targeted
  oligonucleotide delivery, engineered around compact, modular constructs the company says extend
  reach beyond the liver. The clinical pipeline is led by ADX-324 (onvuzosiran), an siRNA against
  prekallikrein now in the Phase 3 STOP-HAE study in hereditary angioedema, and ADX-038
  (agazisiran), an siRNA against complement factor B in Phase 2 for IgA nephropathy and C3
  glomerulopathy, geographic atrophy and paroxysmal nocturnal hemoglobinuria; earlier programmes
  include ADX-626 (factor XI, thrombosis), ADX-077 (obesity) and ADX-199 (amyloid-beta precursor
  protein, neurodegeneration), plus undisclosed extrahepatic CNS, immunology and oncology work. The
  company closed an oversubscribed 200 million dollar Series C in August 2023 co-led by Bain Capital
  Life Sciences and TCGX, and entered a collaboration and license option agreement with AbbVie in
  May 2025. ADARx runs no developer program and publishes no product API, no developer portal and no
  API documentation; the only machine-readable surfaces reachable without credentials are the
  WordPress REST content APIs behind www.adarx.com and stophae.com, both catalogued here.
