    url: openapi/adarx-pharmaceuticals-content-openapi.yml
  - type: Overlay
    url: overlays/adarx-pharmaceuticals-content-overlay.yaml
  - type: Authentication
    url: authentication/adarx-pharmaceuticals-authentication.yml
  - type: ErrorCatalog
    url: errors/adarx-pharmaceuticals-problem-types.yml
  - type: Conventions
    url: conventions/adarx-pharmaceuticals-conventions.yml
  - type: DataModel
    url: data-model/adarx-pharmaceuticals-data-model.yml
  - type: JSONLD
    url: json-ld/adarx-pharmaceuticals-json-ld.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://www.adarx.com/wp-json/ — 213 routes across the namespaces oembed/1.0,
    akismet/v1, redirection/v1, yoast/v1, llar/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1 and
    wp-abilities/v1 — and verified against live anonymous responses on 2026-08-06. Only the 24
    operations that returned data without credentials are modelled. /wp/v2/settings, /wp/v2/themes,
    /wp/v2/plugins, /wp/v2/menus, /wp/v2/widgets, /wp/v2/templates, /wp/v2/block-types,
    /wp/v2/font-collections, /wp/v2/icons, /wp/v2/sidebars, /wp/v2/menu-locations, the block-pattern
    and block-directory collections, the revisions sub-collections, /oembed/1.0/proxy and every
    yoast/v1, redirection/v1 and akismet/v1 functional route all return 401 anonymously. Notably the
    site registers the WordPress Abilities API (`wp-abilities/v1`), an agent-facing capability
    registry, but every endpoint under it returns 401 rest_forbidden anonymously, so no agent
    surface is claimed here. /wp/v2/users DOES return 200 anonymously (two author records, display
    names and slugs only, no email addresses), which is worth noting because it is not the default
    posture for a corporate install. ADARx Pharmaceuticals publishes no developer documentation, no
    API reference, no getting-started guide and no support channel for this surface, so no
    Documentation/APIReference/GettingStarted pointers are emitted; the humanURL above is the
    upstream WordPress REST handbook that defines the wp/v2 contract.
- aid: adarx-pharmaceuticals:adarx-pharmaceuticals-stop-hae-api
  name: ADARx STOP-HAE Trial Site API
  description: >-
    The anonymously readable WordPress REST API behind stophae.com, the patient-recruitment site for
    STOP-HAE — ADARx's Phase 3 randomized, double-blind, placebo-controlled study of ADX-324
    (onvuzosiran) in hereditary angioedema. The install identifies itself as "ADARX1 Patient
    Website" and registers 226 routes. Its distinguishing feature versus the corporate site is a
    custom post type, `clinic` ("Clinics"), carrying 50 published trial-site records that are
    readable without credentials — the only domain-specific entity either ADARx deployment exposes.
    The records give a site code (e.g. 801-01), a permalink and dates; the Advanced Custom Fields
    payload that presumably holds each site's address, principal investigator and contact is an
    EMPTY ARRAY on every record, so no geography is available through the API and ClinicalTrials.gov
    remains the registry of record. The install also carries four patient-facing pages (Home, HCP,
    Prescreener, Privacy Policy), an empty posts collection, and a 592-item media library inflated
    by a WPML 4.9.5 multilingual configuration.
  humanURL: https://stophae.com/
  baseURL: https://stophae.com/wp-json
