  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index published
    at https://stophae.com/wp-json/ — 226 routes across oembed/1.0, wpml/v1, wpml/st/v1, wpml/tm/v1,
    wpml/ate/v1, otgs/installer/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1 and
    wp-abilities/v1 — and verified against live anonymous responses on 2026-08-06. Only the 17
    operations that returned data without credentials are modelled. The WPML translation-management
    namespaces return their namespace index anonymously but every functional route beneath them is
    administrative. /wp/v2/settings and the whole wp-abilities/v1 namespace return 401. No
    developer documentation exists for this surface; the humanURL is the patient site itself.
