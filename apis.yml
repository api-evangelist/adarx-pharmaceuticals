apis:
- aid: adarx-pharmaceuticals:adarx-pharmaceuticals-content-api
  name: ADARx Pharmaceuticals Content API
  description: >-
    The anonymously readable WordPress REST API behind www.adarx.com. It exposes 46 published posts
    (23 press releases, 9 board biographies, 7 clinical-trial listings, 5 leadership biographies and
    3 publications), the 18 corporate pages (Home, Company Overview, Team, Investors, Science
    Overview, Technology, Publications, Pipeline, Patients, News, Careers, Contact, Terms of Use and
    three privacy notices), the 105-item media library, the six categories, the registered post
    types, taxonomies and statuses, cross-content search, the oEmbed 1.0 provider endpoint, and the
    Yoast SEO head renderer that carries the site's schema.org JSON-LD graph. Two things a consumer
    should know. First, unlike most corporate WordPress installs, `content.rendered` IS populated —
    press releases return 4,900 to 5,300 characters of prose — so the API is a usable source for the
    full text of an ADARx announcement. Second, the ADARx clinical pipeline itself is not modelled:
    ADX-038, ADX-324, ADX-626, ADX-077 and ADX-199 with their targets, indications and phases exist
    only as rendered HTML inside page id 10, with no custom post type, taxonomy or ACF projection
    behind them. This is not a developer product ADARx markets; it is the site's own content
    surface, registered at /wp-json/ and verified to return data without credentials. The OpenAPI in
    this repo is derived from the published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://www.adarx.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - press-releases
  - media
  properties:
