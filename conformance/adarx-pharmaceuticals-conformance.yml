summary: >-
  Cross-cutting standards assertions for the two WordPress REST surfaces ADARx Pharmaceuticals
  operates. ADARx is a clinical-stage biotechnology company; it runs a corporate website and a
  patient-recruitment site, not a software platform, and it publishes no compliance program, no
  certification page and no trust center. Every `conforms: false` below is an honest observation,
  not a criticism of an API the company never set out to ship.
standards:
- id: rest
  conforms: true
  evidence: >-
    Resource-oriented paths, a GET-only public surface, JSON representations, and RFC 8288 Link
    headers for pagination. HATEOAS is present via the _links map on every object, including
    targetHints.allow.
- id: openapi
  conforms: false
  evidence: >-
    ADARx publishes no OpenAPI. The two documents in openapi/ are API Evangelist derivations of the
    route indexes the sites publish at /wp-json/, not provider artifacts.
- id: json-schema
  conforms: partial
  evidence: >-
    WordPress exposes a JSON Schema per route via the OPTIONS method and the `schema` block in the
    route index, so a schema is discoverable per endpoint. Verified: OPTIONS /wp/v2/posts returns
    a namespace/methods/endpoints/args document. It is WordPress-flavoured schema, not a published,
    versioned JSON Schema document set.
- id: rfc9457
  conforms: false
  evidence: >-
    Errors are served as application/json with the WordPress {code, message, data} envelope. No
    `type` URI, no `title`, no `instance`, no application/problem+json media type. See
    errors/adarx-pharmaceuticals-problem-types.yml.
- id: rfc8288
  conforms: true
  evidence: >-
    Collection responses carry a Link header with rel="next"/rel="prev", and both hosts expose it
    cross-origin via Access-Control-Expose-Headers.
- id: pagination
  conforms: true
  evidence: >-
    page + per_page (1-100) with X-WP-Total and X-WP-TotalPages headers; offset paging also
    supported. Out-of-range per_page returns a structured 400.
- id: idempotency
  conforms: false
  evidence: >-
    No idempotency-key facility. Moot for the public surface, which is entirely GET, but nothing is
    published for the write half.
- id: oauth2
  conforms: false
  evidence: >-
    /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource returned 404
    on both hosts. No OAuth of any kind. The only advertised credential is WordPress Application
    Passwords (HTTP Basic).
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returned 404 on both hosts.
- id: rfc9116
  conforms: false
  evidence: >-
    /.well-known/security.txt returned 404 on both hosts. No published security contact, no
    disclosure policy, no bug bounty.
- id: rfc8594
  conforms: false
  evidence: >-
    No Sunset or Deprecation headers were observed on any response, and no deprecation policy is
    published.
- id: rfc9309
  conforms: true
  evidence: >-
    https://www.adarx.com/robots.txt returned 200 and is well-formed; nothing is disallowed.
    https://stophae.com/robots.txt returned 200 and disallows only /wp-admin/.
- id: sitemaps-org
  conforms: true
  evidence: >-
    https://www.adarx.com/sitemap_index.xml returned 200; a Yoast sitemap index with two children,
    post-sitemap.xml and page-sitemap.xml.
- id: rss-2.0
  conforms: true
  evidence: >-
    https://www.adarx.com/feed/ returned 200 with 10 items — the most recent press releases. This
