source: >-
  Live probes of https://www.adarx.com and https://stophae.com on 2026-08-06, plus a search of
  www.adarx.com for a versioning policy, deprecation policy, SLA, status page or changelog.
apis:
- adarx-pharmaceuticals-content-api
- adarx-pharmaceuticals-stop-hae-api
summary: >-
  ADARx Pharmaceuticals publishes no API lifecycle commitments of any kind. There is no developer
  portal, no versioning policy, no deprecation policy, no SLA, no status page and no changelog for
  either REST surface. This is expected — neither surface is a product the company markets. What
  follows is what an integrator can actually observe.
versioning:
  scheme: namespace-in-path
  current: wp/v2
  policy_url: null
  detail: >-
    The version is the WordPress core REST namespace, not an ADARx version. ADARx exercises no
    version control over either surface: its shape changes whenever WordPress core or one of the
    installed plugins is upgraded, with no announcement. www.adarx.com self-reports WordPress 7.0.2
    with Elementor 3.25.10; stophae.com self-reports WPML 4.9.5. Treat the contract as unstable and
    re-read the route index at /wp-json/ before relying on any route.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  detail: >-
    No Sunset (RFC 8594) or Deprecation header was observed on any response from either host, and
    no deprecation policy is published. Routes can disappear silently on a plugin deactivation —
    the `clinic` custom post type on stophae.com and the `redirection/v1` and `llar/v1` namespaces
    on www.adarx.com all exist only because a specific plugin is active.
deprecated_operations: []
sla:
