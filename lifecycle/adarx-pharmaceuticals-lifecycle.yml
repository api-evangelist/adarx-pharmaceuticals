changelog_detail: >-
  No API or product changelog is published. The nearest thing is the corporate press-release
  stream at https://www.adarx.com/news/ (46 posts, 2021-09-08 through 2026-06-10, also available as
  RSS at /feed/), which is company news rather than a record of changes to any interface. No
  `type: ChangeLog` pointer is emitted, because pointing a changelog check at a press-release feed
  would misrepresent it.
