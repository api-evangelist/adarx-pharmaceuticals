format: wordpress-rest
rfc9457: false
media_type: application/json
envelope:
  shape: '{ "code": string, "message": string, "data": { "status": integer, ... } }'
  detail: >-
    WordPress's own error envelope. There is no `type` URI, no `title`, no `instance` and no
    application/problem+json media type, so this is NOT RFC 9457 Problem Details. The stable
    machine-readable discriminator is `code`; `message` is human prose and is localisable.
    Validation failures additionally carry `data.params` (a field-to-message map) and
    `data.details` (a per-field nested error with its own `code`).
  note: >-
    The HTTP status is duplicated inside the body at `data.status`. A client should trust the
    transport status; the body copy is informational.
